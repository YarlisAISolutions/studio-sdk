# Weekly version updates. Security updates are on for the repo and ignore
# the PR limit. github-actions keeps the SHA pins (bastion suite included) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
